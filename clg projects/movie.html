
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter Movie Collection</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #e5bd65;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 25px;
        }

        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 300px;
            max-width: 90%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #b58b36;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
        }

        button:hover {
            background: #8e6926;
        }

        .movie-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .movie {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 15px;
            transition: 0.3s;
        }

        .movie:hover {
            transform: translateY(-6px);
        }

        .movie img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie h3 {
            font-size: 16px;
            padding: 12px 8px 5px;
            color: #e5bd65;
        }

        .movie p {
            color: #ccc;
        }

        #message {
            text-align: center;
            margin-top: 25px;
            color: #e5bd65;
        }
    </style>
</head>

<body>

    <h1>⚡ Harry Potter Movie Collection ⚡</h1>
    <p class="subtitle">Welcome to the Wizarding World of Harry Potter!</p>

    <div class="search-box">
        <input type="text" id="searchInput"
        placeholder="Search Harry Potter movie...">

        <button onclick="searchMovies()">Search</button>
    </div>

    <div class="movie-container" id="movieContainer"></div>

    <p id="message"></p>

    <script>

        const movies = [
            {
                title: "Harry Potter and the Philosopher's Stone",
                year: 2001,
                poster: "https://image.tmdb.org/t/p/w500/wuMc08IPKEatf9rnMNXvIDxqP4W.jpg"
            },
            {
                title: "Harry Potter and the Chamber of Secrets",
                year: 2002,
                poster: "https://image.tmdb.org/t/p/w500/sdEOH0992YZ0QSxgXNIGLq1ToUi.jpg"
            },
            {
                title: "Harry Potter and the Prisoner of Azkaban",
                year: 2004,
                poster: "https://image.tmdb.org/t/p/w500/aWxwnYoe8p2d2fcxOqtvAtJ72Rw.jpg"
            },
            {
                title: "Harry Potter and the Goblet of Fire",
                year: 2005,
                poster: "https://image.tmdb.org/t/p/w500/fECBtHlr0RB3foNHDiCBXeg9Bv9.jpg"
            },
            {
                title: "Harry Potter and the Order of the Phoenix",
                year: 2007,
                poster: "https://image.tmdb.org/t/p/w500/5aOyriWkPec0zUDxmHFP9qMmBaj.jpg"
            },
            {
                title: "Harry Potter and the Half-Blood Prince",
                year: 2009,
                poster: "https://image.tmdb.org/t/p/w500/z7uo9zmQdQwU5ZJHFpv2Upl30i1.jpg"
            },
            {
                title: "Harry Potter and the Deathly Hallows Part 1",
                year: 2010,
                poster: "https://image.tmdb.org/t/p/w500/iGoXIpQb7Pot00EEdwpwPajheZ5.jpg"
            },
            {
                title: "Harry Potter and the Deathly Hallows Part 2",
                year: 2011,
                poster: "https://image.tmdb.org/t/p/w500/da22ZBmrDOXOCDRvr8Gic8ldhv4.jpg"
            }
        ];

        const container = document.getElementById("movieContainer");

        function showMovies(movieList) {

            container.innerHTML = "";

            document.getElementById("message").innerText =
                movieList.length === 0 ? "No movie found!" : "";

            movieList.forEach(movie => {

                const div = document.createElement("div");

                div.className = "movie";

                div.innerHTML = `
                    <img src="${movie.poster}"
                    alt="${movie.title}"
                    onerror="this.src='https://placehold.co/300x450/222/ffffff?text=Poster+Unavailable'">

                    <h3>${movie.title}</h3>
                    <p>Release Year: ${movie.year}</p>
                `;

                container.appendChild(div);

            });
        }

        function searchMovies() {

            const searchValue =
                document.getElementById("searchInput").value.toLowerCase();

            const filteredMovies = movies.filter(movie =>
                movie.title.toLowerCase().includes(searchValue)
            );

            showMovies(filteredMovies);
        }

        document.getElementById("searchInput")
            .addEventListener("input", searchMovies);

        showMovies(movies);

    </script>

</body>
</html>
